<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Warscroll Companion</title>

<!-- PWA / Add-to-Home-Screen configuration -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151a">

<!-- iOS-specific: makes "Add to Home Screen" launch as a standalone app
     with no Safari chrome, and sets the icon/status bar style. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warscroll">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-startup-image" href="icon-512.png">
<style>
  @font-face {
    font-family: 'Oswald';
    src: local('Oswald');
  }
  :root{
    --bg-0: #12151a;
    --bg-1: #191d24;
    --bg-2: #212630;
    --line: #2c323d;
    --gold: #c9a24b;
    --gold-bright: #e8c877;
    --text-hi: #eef0f3;
    --text-md: #a6adba;
    --text-lo: #6b7280;
    --danger: #d1584a;
    --good: #5fae7b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#0a0c0f;}
  body{
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-hi);
    display:flex;
    justify-content:center;
    padding: 24px 12px;
  }
  .phone{
    width: 390px;
    max-width: 100%;
    height: 844px;
    background: var(--bg-0);
    border-radius: 46px;
    border: 10px solid #1c1c1e;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    overflow: hidden;
    position: relative;
    display:flex;
    flex-direction:column;
  }
  .notch{
    position:absolute;
    top:10px; left:50%; transform:translateX(-50%);
    width:120px; height:28px;
    background:#000;
    border-radius:20px;
    z-index:50;
  }
  .statusbar{
    height:48px;
    flex-shrink:0;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding: 0 26px 8px 26px;
    font-size:13px;
    font-weight:600;
    color: var(--text-hi);
    letter-spacing:0.2px;
  }
  .screen{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    position:relative;
    scrollbar-width:none;
  }
  .screen::-webkit-scrollbar{display:none;}

  /* Nav header */
  .navheader{
    padding: 6px 18px 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
    flex-shrink:0;
  }
  .navtitle-row{
    display:flex; align-items:center; justify-content:space-between;
  }
  .navtitle{
    font-family: 'Oswald', system-ui, sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-hi);
  }
  .navsub{
    font-size:11px;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top:2px;
    font-weight:600;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color: var(--gold-bright);
    cursor:pointer;
    font-size:18px;
  }
  .icon-btn:active{ background: #2a3140; }

  /* Points header */
  .points-header{
    display:flex; align-items:center; gap:14px;
    padding: 14px 18px;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
  }
  .points-main{flex:1;}
  .points-value{
    font-family:'Oswald', sans-serif;
    font-size: 26px;
    font-weight:700;
    color: var(--text-hi);
    line-height:1;
  }
  .points-value .of{ color: var(--text-lo); font-weight:500; font-size:18px;}
  .points-remaining{
    font-size:11px;
    color: var(--text-md);
    margin-top:4px;
    letter-spacing:0.3px;
  }
  .points-remaining.over{ color: var(--danger); font-weight:600;}
  .ring{
    width:52px;height:52px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    flex-shrink:0;
  }
  .ring svg{ transform: rotate(-90deg); }
  .ring-bg{ stroke: var(--line); }
  .ring-fg{ stroke: var(--gold); transition: stroke-dashoffset 0.4s ease, stroke 0.3s; }
  .ring-fg.over{ stroke: var(--danger); }

  /* Validation banner */
  .validation-banner{
    background: rgba(209,88,74,0.08);
    border-bottom: 1px solid rgba(209,88,74,0.25);
    padding: 10px 18px;
    flex-shrink:0;
  }
  .validation-item{
    display:flex; align-items:center; gap:8px;
    font-size:12px;
    color: #e8a99e;
    margin: 3px 0;
  }
  .validation-item .dot{
    width:5px;height:5px;border-radius:50%;
    background: var(--danger); flex-shrink:0;
  }

  /* List */
  .list-area{ flex:1; padding: 10px 14px 100px 14px; }
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 80px 30px;
    text-align:center;
    color: var(--text-lo);
  }
  .empty-state .glyph{
    font-size:40px; margin-bottom:14px; opacity:0.5;
  }
  .empty-state .title{
    color: var(--text-md); font-size:15px; font-weight:600; margin-bottom:6px;
  }
  .empty-state .sub{ font-size:12.5px; line-height:1.5; }

  .entry-card{
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-left: 3px solid transparent;
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 10px;
    position:relative;
    transition: transform 0.15s;
  }
  .entry-card.general{ border-left-color: var(--gold); }
  .entry-card:active{ transform: scale(0.98); }

  .entry-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:12px;
  }
  .entry-portrait{
    width:52px; height:52px;
    border-radius:10px;
    flex-shrink:0;
    background: linear-gradient(160deg, #2a3140, #191d24);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color: var(--gold);
    position:relative;
    overflow:hidden;
  }
  .entry-portrait.has-photo{ border-color: var(--gold); }
  .entry-portrait img{ width:100%; height:100%; object-fit:cover; }
  .entry-portrait svg{ width:26px; height:26px; opacity:0.85; }
  .entry-portrait .add-photo-badge{
    position:absolute; bottom:-1px; right:-1px;
    width:18px; height:18px; border-radius:6px 0 8px 0;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#1a1508; font-weight:800;
  }
  .entry-main{ flex:1; min-width:0; }
  .entry-name-row{
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .entry-name{
    font-weight:700; font-size:14.5px; color: var(--text-hi);
  }
  .general-badge{
    font-size:9px; font-weight:800; letter-spacing:0.6px;
    color: #1a1508;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    padding: 2px 7px 3px 7px;
    border-radius: 5px;
  }
  .entry-keywords{
    font-size:10.5px; color: var(--text-lo);
    margin-top:2px;
    letter-spacing:0.2px;
  }
  .entry-points{
    font-weight:700; font-size:14px; color: var(--gold-bright);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }
  .entry-reinforce{
    font-size:9.5px; color: var(--text-lo); text-align:right; margin-top:2px;
  }

  .stat-row{
    display:flex; gap:16px; margin-top:10px;
    padding-top:10px;
    border-top: 1px solid var(--line);
  }
  .stat-badge{ text-align:center; min-width:28px; }
  .stat-badge .val{ font-size:13px; font-weight:700; color:var(--text-hi); font-variant-numeric: tabular-nums;}
  .stat-badge .lbl{ font-size:8.5px; color: var(--text-lo); text-transform:uppercase; letter-spacing:0.5px; margin-top:1px;}

  .entry-actions{
    display:flex; gap:8px; margin-top:10px;
  }
  .mini-btn{
    flex:1;
    font-size:11px; font-weight:600;
    padding: 7px 0;
    border-radius: 8px;
    text-align:center;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--text-md);
    cursor:pointer;
  }
  .mini-btn.active{
    background: rgba(201,162,75,0.15);
    border-color: var(--gold);
    color: var(--gold-bright);
  }
  .mini-btn.danger:active{ background: rgba(209,88,74,0.15); color: var(--danger); }

  /* FAB */
  .fab{
    position:absolute;
    bottom:88px; right:20px;
    width:56px; height:56px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px rgba(201,162,75,0.35);
    font-size:26px; color:#1a1508; font-weight:300;
    cursor:pointer;
    z-index:20;
  }
  .fab:active{ transform: scale(0.94); }

  /* Tab bar */
  .tabbar{
    display:flex;
    border-top: 1px solid var(--line);
    background: rgba(20,23,29,0.92);
    backdrop-filter: blur(20px);
    padding: 8px 0 22px 0;
    flex-shrink:0;
  }
  .tab{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--text-lo);
    cursor:pointer;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .tab.active{ color: var(--gold-bright); }
  .tab svg{ width:23px; height:23px; }

  /* Sheet overlay (unit picker / detail) */
  .sheet-overlay{
    position:absolute; inset:0;
    background: rgba(0,0,0,0.5);
    z-index:100;
    display:flex; align-items:flex-end;
    opacity:0; pointer-events:none;
    transition: opacity 0.25s;
  }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    background: var(--bg-0);
    width:100%;
    max-height: 88%;
    border-radius: 20px 20px 0 0;
    display:flex; flex-direction:column;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    border-top: 1px solid var(--line);
  }
  .sheet-overlay.show .sheet{ transform: translateY(0); }
  .sheet-handle{
    width:36px;height:4px;background:var(--line);border-radius:2px;
    margin: 10px auto 4px auto;
  }
  .sheet-header{
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 18px 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-title{ font-family:'Oswald',sans-serif; font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;}
  .sheet-close{ color: var(--gold-bright); font-size:14px; font-weight:600; cursor:pointer; }
  .search-bar{
    margin: 12px 18px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font-size:13px;
    color: var(--text-lo);
    display:flex; align-items:center; gap:8px;
  }
  .sheet-body{ flex:1; overflow-y:auto; padding: 4px 14px 30px 14px; }

  .pick-card{
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 9px;
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  .pick-card:active{ background: var(--bg-2); }
  .pick-name{ font-weight:700; font-size:14px; }
  .pick-sub{ font-size:10.5px; color: var(--text-lo); margin-top:2px; }
  .pick-pts{ font-weight:700; color: var(--gold-bright); font-size:13.5px; white-space:nowrap; margin-left:10px;}

  /* Combat calc styles */
  .calc-section{
    padding: 16px 18px 6px 18px;
  }
  .calc-section-title{
    font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--gold); margin-bottom:10px;
  }
  .calc-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .calc-label{ font-size:13.5px; color: var(--text-hi); }
  .calc-input{
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--gold-bright);
    font-weight:700;
    font-size:13px;
    width:70px;
    text-align:center;
    padding:6px 0;
    font-variant-numeric: tabular-nums;
  }
  .stepper{
    display:flex; align-items:center; gap:10px;
  }
  .stepper-btn{
    width:26px; height:26px; border-radius:7px;
    background: var(--bg-2); border:1px solid var(--line);
    color: var(--gold-bright); font-size:15px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .stepper-btn:active{ background:#2a3140; }
  .stepper-val{ min-width:44px; text-align:center; font-weight:700; font-size:13.5px; font-variant-numeric: tabular-nums; }

  .toggle{
    width:44px; height:26px; border-radius:14px;
    background: var(--bg-2); border:1px solid var(--line);
    position:relative; cursor:pointer;
  }
  .toggle.on{ background: rgba(201,162,75,0.35); border-color: var(--gold); }
  .toggle-knob{
    position:absolute; top:2px; left:2px;
    width:20px; height:20px; border-radius:50%;
    background: var(--text-lo);
    transition: left 0.2s, background 0.2s;
  }
  .toggle.on .toggle-knob{ left:20px; background: var(--gold-bright); }

  .result-card{
    margin: 16px 18px 24px 18px;
    background: linear-gradient(160deg, rgba(201,162,75,0.10), rgba(201,162,75,0.02));
    border: 1px solid rgba(201,162,75,0.35);
    border-radius: 16px;
    padding: 18px;
  }
  .result-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 7px 0;
  }
  .result-row .rlabel{ font-size:12.5px; color: var(--text-md); }
  .result-row .rval{ font-size:14px; font-weight:600; color: var(--text-hi); font-variant-numeric: tabular-nums; }
  .result-row.final{
    border-top: 1px solid rgba(201,162,75,0.3);
    margin-top:6px; padding-top:14px;
  }
  .result-row.final .rlabel{ color: var(--gold-bright); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.5px;}
  .result-row.final .rval{ font-size:26px; font-family:'Oswald',sans-serif; color: var(--gold-bright); font-weight:700; }
  .save-note{
    font-size:11px; color: var(--text-lo); text-align:center; margin-top:8px;
  }

  /* Rules tab */
  .rules-search{
    margin: 14px 18px 6px 18px;
  }
  .rule-card{
    margin: 8px 14px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
  }
  .rule-phase{
    font-size:9.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color: var(--gold);
  }
  .rule-name{ font-weight:700; font-size:14px; margin: 4px 0 5px 0; }
  .rule-text{ font-size:12px; color: var(--text-md); line-height:1.5; }

  .swipe-hint{
    font-size:9.5px; color: var(--text-lo); text-align:center; padding: 6px 0 2px 0; letter-spacing:0.3px;
  }

  /* Loadout chips (artifact / spell) on entry card */
  .loadout-row{
    margin-top: 10px;
    display:flex; flex-direction:column; gap:6px;
  }
  .loadout-chip{
    display:flex; align-items:center; gap:8px;
    background: rgba(201,162,75,0.08);
    border: 1px solid rgba(201,162,75,0.3);
    border-radius: 9px;
    padding: 7px 10px;
    cursor:pointer;
  }
  .loadout-chip.empty{
    background: var(--bg-2);
    border: 1px dashed var(--line);
    color: var(--text-lo);
  }
  .loadout-chip .icon{ font-size:13px; }
  .loadout-chip .body{ flex:1; min-width:0; }
  .loadout-chip .lname{ font-size:12px; font-weight:700; color: var(--gold-bright); }
  .loadout-chip.empty .lname{ color: var(--text-lo); font-weight:600; }
  .loadout-chip .lsub{ font-size:10px; color: var(--text-lo); margin-top:1px; }
  .loadout-chip .chevron{ color: var(--text-lo); font-size:12px; }

  /* Picker sheet cards for artifact/spell */
  .lore-tag{
    display:inline-block;
    font-size:9px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    color: var(--text-lo);
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 2px 7px;
    border-radius: 6px;
    margin-top:5px;
  }
  .lore-tag.universal{ color: var(--gold-bright); border-color: rgba(201,162,75,0.4); }
  .pick-card.wide{ display:block; }
  .pick-card.wide .pick-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .pick-card .pick-text{ font-size:11.5px; color: var(--text-md); line-height:1.45; margin-top:6px; }
  .pick-card .cv-badge{
    font-size:11px; font-weight:800; color:#1a1508;
    background: var(--gold-bright);
    border-radius: 6px; padding: 3px 7px;
    white-space:nowrap;
  }

  /* Photo picker in unit detail */
  .photo-picker-row{
    display:flex; gap:10px; padding: 14px 18px;
  }
  .photo-slot{
    flex:1; aspect-ratio: 1;
    border-radius: 14px;
    background: var(--bg-2);
    border: 1.5px dashed var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    color: var(--text-lo);
    font-size:11px;
    cursor:pointer;
  }
  .photo-slot.selected{ border-color: var(--gold); border-style:solid; background: rgba(201,162,75,0.08); color: var(--gold-bright); }
  .photo-slot svg{ width:22px; height:22px; }

  /* Full warscroll detail sheet */
  .ws-hero{
    height: 190px;
    position:relative;
    background: linear-gradient(160deg, #23140f, #0f0d10);
    display:flex; align-items:flex-end;
    flex-shrink:0;
  }
  .ws-hero.has-art{ background-size:cover; background-position:center; }
  .ws-hero::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(10,10,10,0) 30%, rgba(10,10,10,0.92) 100%);
  }
  .ws-hero-content{ position:relative; z-index:2; padding: 16px 18px; }
  .ws-faction{ font-size:10px; font-weight:800; letter-spacing:1.2px; color: var(--gold-bright); text-transform:uppercase; }
  .ws-name{ font-family:'Oswald',sans-serif; font-size:24px; font-weight:700; color:#fff; margin-top:2px; text-transform:uppercase; letter-spacing:0.3px; }
  .ws-pts{ font-size:12px; color: rgba(255,255,255,0.75); margin-top:2px; }
  .ws-hero-glyph{
    position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    color: rgba(255,255,255,0.12);
    font-size:90px;
  }
  .ws-back{
    position:absolute; top:14px; left:14px; z-index:5;
    width:32px;height:32px; border-radius:9px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    display:flex;align-items:center;justify-content:center;
    color:#fff; cursor:pointer;
  }
  .ws-body{ flex:1; overflow-y:auto; padding-bottom:24px; }
  .ws-statblock{
    display:flex;
    margin: 16px 18px 0 18px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 0;
  }
  .ws-stat{ flex:1; text-align:center; }
  .ws-stat .v{ font-size:16px; font-weight:700; color:var(--text-hi); }
  .ws-stat .l{ font-size:9px; color:var(--text-lo); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }

  .ws-section-title{
    font-size:11px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase;
    color: var(--text-lo);
    padding: 20px 18px 8px 18px;
  }
  .ws-table{
    margin: 0 18px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
  }
  .ws-table-head, .ws-table-row{
    display:flex;
    padding: 9px 12px;
    font-size:11.5px;
  }
  .ws-table-head{
    color: var(--text-lo); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px;
    border-bottom: 1px solid var(--line);
  }
  .ws-table-row:not(:last-child){ border-bottom: 1px solid var(--line); }
  .ws-table-row{ color: var(--text-hi); }
  .wcol-name{ flex:1.6; }
  .wcol{ flex:1; text-align:center; }

  .ws-ability{
    margin: 0 18px 10px 18px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 12px;

// ---------------- Local persistence (survives closing the app) ----------------
//
// Everything lives in localStorage under one namespaced key per data slice.
// This is what makes the Home Screen version "sticky" — the in-tab preview
// version this replaced kept everything in memory only, so a refresh wiped
// it. localStorage on iOS Safari/PWA persists across launches, though Apple
// can clear it if the app goes unused for a long stretch — see the Export
// button in Settings for a manual backup path.

const STORAGE_PREFIX = 'warscroll.';

function storageSave(key, value){
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error('Storage save failed for', key, e);
  }
}
function storageLoad(key, fallback){
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) {
    console.error('Storage load failed for', key, e);
    return fallback;
  }
}

function mergeByName(existingArr, incomingArr, keyFn){
  for (const item of incomingArr) {
    const key = keyFn(item);
    const idx = existingArr.findIndex(e => keyFn(e) === key);
    if (idx >= 0) existingArr[idx] = item;
    else existingArr.push(item);
  }
}

// ---------------- Structured combat modifiers ----------------
//
// Free-text ability/artifact/spell descriptions can't be reliably applied
// to a dice calculation automatically — "add 1 to Rend" and "once per
// battle, deals D3 mortal wounds instead of attacking" are structurally
// different effects. So artifacts/spells/unit abilities can *optionally*
// carry a small structured `modifiers` array alongside their free text.
// When present, the calculator can offer them as one-tap toggles that
// apply a known, predictable change. When absent (the common case for
// anything freshly imported and not yet annotated), the calculator still
// shows the ability's name and text so you can apply it by adjusting the
// manual fields yourself — nothing is silently skipped.
//
// Modifier shape:
//   { stat: 'hit'|'wound'|'rend'|'damage'|'attacks', op: 'add'|'set', value: Number,
//     label: String, condition: String (optional, informational only) }
//
// This schema is intentionally tiny. It covers the common flat modifiers
// (+1 to hit, -1 rend, etc.) that make up most artifacts/spells/command
// abilities. Anything more exotic (reroll rules, "instead of attacking",
// mortal-wound-on-6 riders) still needs to be read and reasoned about by
// you — the modifier chip's label always shows the full effect text so
// you're never guessing what a toggle does.

function applyModifiers(baseInput, activeModifiers){
  const result = { ...baseInput };
  for (const mod of activeModifiers) {
    if (mod.op === 'add') {
      if (mod.stat === 'hit') result.hitMod = (result.hitMod||0) + mod.value;
      else if (mod.stat === 'wound') result.woundMod = (result.woundMod||0) + mod.value;
      else if (mod.stat === 'rend') result.rend = (result.rend||0) + mod.value;
      else if (mod.stat === 'attacks') result.attacks = (result.attacks||0) + mod.value;
      else if (mod.stat === 'damage') result.damage = (result.damage||0) + mod.value;
      else if (mod.stat === 'save') result.targetSave = Math.max(2, (result.targetSave||4) + mod.value);
    } else if (mod.op === 'set') {
      if (mod.stat === 'hit') result.toHit = mod.value;
      else if (mod.stat === 'wound') result.toWound = mod.value;
      else if (mod.stat === 'rend') result.rend = mod.value;
      else if (mod.stat === 'attacks') result.attacks = mod.value;
      else if (mod.stat === 'damage') result.damage = mod.value;
      else if (mod.stat === 'save') result.targetSave = mod.value;
    }
  }
  return result;
}

// ---------------- Situational modifiers (charge, buffs, unit sub-abilities) ----------------
//
// There's no single universal AoS rule for "charged" or "has a musician" —
// each battletome/unit defines its own bonus (if any) for these, so this
// can't be hardcoded as a fixed mechanical effect the way a specific
// artifact's text can. Instead this is a short list of common situational
// *labels* you toggle on, each starting at a neutral (0) value that you
// dial in yourself based on what your unit's warscroll actually says —
// the toggle just gives you a labeled, rememberable slot instead of losing
// track of "wait, was I already counting the charge bonus in Rend?"
//
// Saved per-device so if you always run the same combo (e.g. this unit
// always has a standard bearer), you don't re-enter it every session.
const SITUATIONAL_MODIFIER_DEFAULTS = [
  { key:'charged', label:'Charged This Turn', stat:'hit', op:'add', value:0 },
  { key:'musician', label:'Musician / Buff Aura', stat:'hit', op:'add', value:0 },
  { key:'standard', label:'Standard Bearer Bonus', stat:'wound', op:'add', value:0 },
  { key:'inspiring', label:'Inspiring Presence / Command', stat:'rend', op:'add', value:0 }
];

/* ---------------- Combat math (mirrors CombatCalculator.swift) ---------------- */

function parseDiceAverage(v){
  v = String(v).toUpperCase().replace(/\s/g,'');
  if(!isNaN(parseFloat(v)) && !v.includes('D')) return parseFloat(v);
  let bonus = 0, base = v;
  if(v.includes('+')){
    const idx = v.indexOf('+');
    bonus = parseFloat(v.slice(idx+1)) || 0;
    base = v.slice(0, idx);
  }
  if(base.includes('D')){
    const parts = base.split('D');
    const mult = parts[0] ? parseFloat(parts[0]) : 1;
    const die = parseFloat(base.startsWith('D') ? base.slice(1) : parts[1]) || 6;
    return mult * ((die+1)/2) + bonus;
  }
  return bonus;
}
function probability(target, modifier=0){
  const adj = Math.max(2, Math.min(7, target - modifier));
  if(adj > 6) return 0;
  return (7 - adj) / 6;
}
function calculate(input){
  const hitChance = probability(input.toHit, input.hitMod);
  const woundChance = probability(input.toWound, input.woundMod);
  const expHits = input.attacks * hitChance;
  const expWounds = expHits * woundChance;
  const modSave = Math.min(7, input.targetSave + input.rend);
  const saveChance = modSave > 6 ? 0 : probability(modSave);
  let expUnsaved = expWounds * (1 - saveChance);
  if(input.targetWard){
    expUnsaved *= (1 - probability(input.targetWard));
  }
  const expDamage = expUnsaved * input.damage;
  return { expHits, expWounds, expUnsaved, expDamage, effectiveSave: modSave };
}

/* ---------------- List helpers ---------------- */

function unitTotalPoints(entry){
  return entry.unit.points + (entry.unit.points * entry.reinforcements);
}
function armyTotalPoints(list){
  return list.entries.reduce((s,e)=>s+unitTotalPoints(e),0);
}
function validationIssues(list){
  const issues = [];
  const total = armyTotalPoints(list);
  if(total > list.pointsLimit) issues.push(`Over points limit by ${total - list.pointsLimit}`);
  if(list.entries.length && !list.entries.find(e=>e.isGeneral)) issues.push('No General selected');
  const heroCount = list.entries.filter(e=>e.unit.keywords.includes('HERO')).length;
  if(heroCount > 6) issues.push('Too many Heroes (max 6)');
  const battlelineCount = list.entries.filter(e=>e.unit.keywords.includes('BATTLELINE')).length;
  if(list.entries.length && battlelineCount === 0) issues.push('No Battleline units — most formats require 2-3');
  const artifactCount = list.entries.filter(e=>e.artifact).length;
  if(artifactCount > 1) issues.push(`Only 1 Artifact of Power allowed per army (currently ${artifactCount})`);
  return issues;
}

// Reads each picked image as a base64 data URL and stores it directly in
// localStorage alongside everything else. Data URLs drop straight into
// background-image the same way the old CSS-gradient placeholders did, so
// no other rendering code needs to change. Note: localStorage has roughly
// a 5-10MB ceiling depending on the browser, so this resizes large photos
// down before storing — a full-res phone photo (4-8MB) would eat that
// budget in one or two imports otherwise.
function handleArtUpload(fileList){
  const files = Array.from(fileList || []);
  if(files.length === 0) return;
  let remaining = files.length;
  files.forEach(file => {
    resizeImageFile(file, 1600, (dataUrl) => {
      if(dataUrl){
        homeArtPool.push(dataUrl);
        if(!currentHeroArt) pickHeroArt();
      }
      remaining--;
      if(remaining === 0){
        storageSave('homeArtPool', homeArtPool);
        openArtManager();
      }
    });
  });
}

// Downscales an image file to maxDim on its longest side and returns a JPEG
// data URL via callback. Keeps storage usage sane and avoids the multi-MB
// PNGs a phone camera produces blowing through localStorage's quota.
function resizeImageFile(file, maxDim, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      try {
        callback(canvas.toDataURL('image/jpeg', 0.85));
      } catch(err){
        console.error('Image encode failed', err);
        callback(null);
      }
    };
    img.onerror = () => callback(null);
    img.src = e.target.result;
  };
  reader.onerror = () => callback(null);
  reader.readAsDataURL(file);
}

// Reuses the exact same single-item modifier editor as the import review
// screen, just pre-filled and saving back into the existing array slot
// instead of merging a fresh import.
function editLoreItem(kind, idx){
  const arr = kind === 'spells' ? contentLibrary.spells : contentLibrary.artifacts;
  const item = arr[idx];
  const isSpells = kind === 'spells';
  const state = {
    name: item.name, lore: item.lore, text: item.text,
    castingValue: item.castingValue || 6,
    _hasModifier: !!(item.modifiers && item.modifiers.length),
    _mod: (item.modifiers && item.modifiers[0]) ? { ...item.modifiers[0] } : { stat:'hit', op:'add', value:1, label:'' }
  };
  const STAT_OPTIONS = isSpells
    ? [['hit','To Hit'],['wound','To Wound'],['rend','Rend'],['damage','Damage'],['attacks','Attacks'],['save','Enemy/Target Save']]
    : [['hit','To Hit'],['wound','To Wound'],['rend','Rend'],['damage','Damage'],['attacks','Attacks']];

  function draw(){
    sheetRoot.innerHTML = `
      <div class="sheet-overlay show" id="pickerOverlay">
        <div class="sheet" style="max-height:80%">
          <div class="sheet-handle"></div>
          <div class="sheet-header">
            <div class="sheet-title">Edit ${isSpells?'Spell':'Artifact'}</div>
            <div class="sheet-close" onclick="closeSheet()">Cancel</div>
          </div>
          <div class="sheet-body">
            <input class="form-input" value="${escapeHtml(state.name)}" oninput="window.__el_name(this.value)" placeholder="Name">
            <input class="form-input" value="${escapeHtml(state.lore)}" oninput="window.__el_lore(this.value)" placeholder="Lore / Faction">
            ${isSpells ? `<input class="calc-input" style="width:70px; margin-bottom:12px;" value="${state.castingValue}" oninput="window.__el_cv(this.value)" placeholder="CV">` : ''}
            <textarea class="form-input" style="min-height:60px;" oninput="window.__el_text(this.value)">${escapeHtml(state.text)}</textarea>

            <div style="border-top:1px solid var(--line); padding-top:10px; margin-top:6px;">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div style="font-size:11px; color:var(--text-md);">Apply as dice calculator modifier?</div>
                <div class="toggle ${state._hasModifier?'on':''}" onclick="window.__el_toggleMod()"><div class="toggle-knob"></div></div>
              </div>
              ${state._hasModifier ? `
                <div style="display:flex; gap:6px; margin:8px 0 6px 0;">
                  <select class="form-input" style="margin:0; flex:1.3;" onchange="window.__el_modStat(this.value)">
                    ${STAT_OPTIONS.map(([val,label])=>`<option value="${val}" ${state._mod.stat===val?'selected':''}>${label}</option>`).join('')}
                  </select>
                  <select class="form-input" style="margin:0; flex:1;" onchange="window.__el_modOp(this.value)">
                    <option value="add" ${state._mod.op==='add'?'selected':''}>Add</option>
                    <option value="set" ${state._mod.op==='set'?'selected':''}>Set to</option>
                  </select>
                  <input class="calc-input" style="width:56px;" type="number" value="${state._mod.value}" oninput="window.__el_modValue(this.value)">
                </div>
                <input class="form-input" style="margin:0;" placeholder="Chip label" value="${escapeHtml(state._mod.label)}" oninput="window.__el_modLabel(this.value)">
              ` : ''}
            </div>
          </div>
          <div class="form-create-btn" onclick="window.__el_save()">Save</div>
        </div>
      </div>
    `;
  }
  window.__el_name = v => state.name = v;
  window.__el_lore = v => state.lore = v;
  window.__el_text = v => state.text = v;
  window.__el_cv = v => state.castingValue = parseInt(v)||6;
  window.__el_toggleMod = () => {
    state._hasModifier = !state._hasModifier;
    if(state._hasModifier && !state._mod.label){
      const sign = state._mod.op==='add' ? (state._mod.value>=0?'+':'') : 'Set to ';
      state._mod.label = `${sign}${state._mod.value} ${state._mod.stat}`;
    }
    draw();
  };
  window.__el_modStat = v => { state._mod.stat = v; draw(); };
  window.__el_modOp = v => { state._mod.op = v; draw(); };
  window.__el_modValue = v => { state._mod.value = parseInt(v)||0; };
  window.__el_modLabel = v => { state._mod.label = v; };
  window.__el_save = () => {
    item.name = state.name;
    item.lore = state.lore;
    item.text = state.text;
    if(isSpells) item.castingValue = state.castingValue;
    if(state._hasModifier){
      item.modifiers = [{
        stat: state._mod.stat, op: state._mod.op, value: state._mod.value,
        label: state._mod.label || `${state._mod.op==='add'?'+':'Set to '}${state._mod.value} ${state._mod.stat}`,
        side: (state._mod.stat === 'save') ? 'defender' : undefined
      }];
    } else {
      delete item.modifiers;
    }
    saveContentLibrary();
    closeSheet();
    renderManageLore();
  };
  draw();
}

// Full backup payload. `includeImages` controls whether homeArtPool (which
// can be several MB of base64 JPEGs) and unit/warscroll photos are included
// — kept optional because most of the time you actually care about getting
// your lists and imported battletome data back, not re-downloading photos
// you could just re-import from your camera roll again anyway.
function exportAllData(includeImages){
  const payload = {
    exportedAt: new Date().toISOString(),
    version: 2,
    includesImages: !!includeImages,
    lists: includeImages ? savedLists : stripImagesFromLists(savedLists),
    contentLibrary: includeImages ? contentLibrary : stripImagesFromLibrary(contentLibrary),
    homeArtPool: includeImages ? homeArtPool : [],
    calcSituational: calcState.situational
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const suffix = includeImages ? 'full' : 'lists';
  a.download = `warscroll_backup_${suffix}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Deep-clones and blanks out photo fields so the lightweight export doesn't
// carry multi-MB base64 strings for images you can just re-import later.
function stripImagesFromLists(lists){
  return JSON.parse(JSON.stringify(lists)).map(list => {
    list.entries.forEach(e => { if(e.unit) e.unit.photo = null; });
    return list;
  });
}
function stripImagesFromLibrary(lib){
  const clone = JSON.parse(JSON.stringify(lib));
  (clone.units||[]).forEach(u => { u.photo = null; });
  return clone;
}

function importAllData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let payload;
    try {
      payload = JSON.parse(e.target.result);
    } catch (err) {
      alert('Could not read that file as a valid backup.');
      return;
    }

    // Back-compat: the original export format was just { lists: [...] }.
    // version 2 adds contentLibrary/homeArtPool/calcSituational alongside.
    const incomingLists = Array.isArray(payload) ? payload : (payload.lists || []);
    const incomingLibrary = payload.contentLibrary || null;
    const incomingArt = payload.homeArtPool || [];
    const incomingSituational = payload.calcSituational || null;

    let importedCounts = [];

    if(incomingLists.length > 0){
      const reIded = incomingLists.map(list => ({
        ...list,
        id: makeId(),
        entries: (list.entries || []).map(entry => ({ ...entry, id: undefined }))
      }));
      savedLists.push(...reIded);
      storageSave('savedLists', savedLists);
      importedCounts.push(`${reIded.length} list(s)`);
    }

    if(incomingLibrary){
      let unitCount = 0, spellCount = 0, artifactCount = 0, ruleCount = 0;
      if(Array.isArray(incomingLibrary.units)){
        mergeByName(contentLibrary.units, incomingLibrary.units, u => u.name + '|' + u.faction);
        unitCount = incomingLibrary.units.length;
      }
      if(Array.isArray(incomingLibrary.spells)){
        mergeByName(contentLibrary.spells, incomingLibrary.spells, s => s.name);
        spellCount = incomingLibrary.spells.length;
      }
      if(Array.isArray(incomingLibrary.artifacts)){
        mergeByName(contentLibrary.artifacts, incomingLibrary.artifacts, a => a.name);
        artifactCount = incomingLibrary.artifacts.length;
      }
      if(Array.isArray(incomingLibrary.ruleSections)){
        mergeByName(contentLibrary.ruleSections, incomingLibrary.ruleSections, s => s.name);
        ruleCount = incomingLibrary.ruleSections.length;
      }
      saveContentLibrary();
      if(unitCount) importedCounts.push(`${unitCount} unit(s)`);
      if(spellCount) importedCounts.push(`${spellCount} spell(s)`);
      if(artifactCount) importedCounts.push(`${artifactCount} artifact(s)`);
      if(ruleCount) importedCounts.push(`${ruleCount} rule section(s)`);
    }

    if(incomingArt.length > 0){
      homeArtPool.push(...incomingArt);
      storageSave('homeArtPool', homeArtPool);
      if(!currentHeroArt) pickHeroArt();
      importedCounts.push(`${incomingArt.length} art image(s)`);
    }

    if(incomingSituational){
      calcState.situational = { ...calcState.situational, ...incomingSituational };
      saveSituationalDefaults();
    }

    if(importedCounts.length === 0){
      alert('That backup file was valid JSON but contained nothing recognizable to import.');
      return;
    }
    alert(`Restored: ${importedCounts.join(', ')}.`);
    renderSettings();
  };
  reader.readAsText(file);
}

function clearAllData(){
  if(!confirm('This deletes every list, imported unit/spell/artifact, and image from this device. This cannot be undone. Continue?')) return;
  for (const key in localStorage) {
    if (key.startsWith(STORAGE_PREFIX)) localStorage.removeItem(key);
  }
  savedLists = [];
  homeArtPool = [];
  currentHeroArt = null;
  activeListId = null;
  contentLibrary = { units: [], spells: [], artifacts: [], ruleSections: [] };
  calcState.situational = {};
  switchTab('builder');
}

function duplicateList(id){
  const list = savedLists.find(l=>l.id===id);
  if(!list) return;
  const copy = JSON.parse(JSON.stringify(list));
  copy.id = makeId();
  copy.name = list.name.endsWith('(Copy)') ? list.name + ' 2' : list.name + ' (Copy)';
  copy.createdAt = Date.now();
  copy.updatedAt = Date.now();
  // Fresh entry IDs so editing the copy never touches the original
  copy.entries = copy.entries.map(e => ({ ...e, unit: { ...e.unit } }));
  savedLists.push(copy);
  storageSave('savedLists', savedLists);
  closeSheet();
  render();
}
function deleteList(id){
  if(!confirm('Delete this list? This cannot be undone.')) return;
  savedLists = savedLists.filter(l=>l.id!==id);
  storageSave('savedLists', savedLists);
  if(activeListId===id) activeListId = null;
  closeSheet();
  render();
}
function exportList(id){
  const list = savedLists.find(l=>l.id===id);
  if(!list) return;
  const blob = new Blob([JSON.stringify(list, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${list.name.replace(/[^a-z0-9]/gi,'_')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeSheet();
}

function renderRules(searchText){
  searchText = searchText || '';

  // Built-in demo entries plus anything imported via extract_pdf.py --type
  // rules, reviewed, and saved. Imported sections are tagged so they can be
  // visually distinguished and so re-importing the same section (matched by
  // name) cleanly overwrites rather than duplicating.
  const builtIn = RULES.map(r => ({...r, _imported:false}));
  const imported = contentLibrary.ruleSections.map(r => ({...r, _imported:true}));
  const all = [...builtIn, ...imported];

  const filtered = searchText
    ? all.filter(r =>
        r.name.toLowerCase().includes(searchText.toLowerCase()) ||
        r.phase.toLowerCase().includes(searchText.toLowerCase()) ||
        r.text.toLowerCase().includes(searchText.toLowerCase()))
    : all;

  // Group by phase so imported sections slot in next to the built-in ones
  // for the same phase, rather than appearing as a disconnected second list.
  const byPhase = {};
  filtered.forEach(r => { (byPhase[r.phase] = byPhase[r.phase] || []).push(r); });
  const phaseOrder = ['Hero Phase','Movement Phase','Shooting Phase','Charge Phase','Combat Phase','Battleshock Phase'];
  const orderedPhases = [
    ...phaseOrder.filter(p => byPhase[p]),
    ...Object.keys(byPhase).filter(p => !phaseOrder.includes(p)).sort()
  ];

  const bodyHtml = orderedPhases.length === 0
    ? `<div class="empty-state"><div class="glyph">📭</div><div class="title">No rules found</div></div>`
    : orderedPhases.map(phase => `
        <div class="ws-section-title">${escapeHtml(phase)}</div>
        ${byPhase[phase].map(r => `
          <div class="rule-card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div class="rule-name">${escapeHtml(r.name)}</div>
              ${r._imported ? '<span style="font-size:9px; font-weight:800; color:var(--gold-bright); background:rgba(201,162,75,0.12); border:1px solid rgba(201,162,75,0.35); padding:2px 6px; border-radius:6px; white-space:nowrap; margin-left:8px;">IMPORTED</span>' : ''}
            </div>
            <div class="rule-text">${escapeHtml(r.text)}</div>
          </div>
        `).join('')}
      `).join('');

  screen.innerHTML = `
    <div class="navheader">
      <div class="navtitle-row">
        <div>
          <div class="navtitle">Rules Reference</div>
          <div class="navsub">${imported.length > 0 ? `Core Rules + ${imported.length} Imported Section(s)` : 'Core Rules Companion'}</div>
        </div>
      </div>
    </div>
    <div class="rules-search">
      <div class="search-bar" onclick="promptRulesSearch()">🔍 ${searchText ? escapeHtml(searchText) + ' ✕' : 'Search phases & rules…'}</div>
    </div>
    <div style="flex:1; overflow-y:auto; padding-bottom:20px;">
      ${bodyHtml}
    </div>
  `;
}
function promptRulesSearch(){
  const current = document.querySelector('.rules-search .search-bar')?.textContent.includes('✕');
  if(current){
    renderRules('');
    return;
  }
  const q = prompt('Search rules by phase, name, or text:', '');
  if(q !== null) renderRules(q);
}

      <div style="margin:14px 18px 0 18px;">
        <div class="pick-card" onclick="navGo('manageunits')">
          <div class="pick-name">Manage Imported Units →</div>
        </div>
      </div>
    </div>
  `;
}

// Reads the JSON file you picked, does light shape-validation so a wrong
// file type gives a clear error instead of a silent failure, then opens
// the matching review sheet. Nothing here touches the network.
function handleImportFile(file, kind){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch (err) {
      alert('That file isn\'t valid JSON. Make sure you picked the file extract_pdf.py wrote out.');
      return;
    }
    try {
      openImportReview(kind, data, file.name);
    } catch (err) {
      alert(`That JSON doesn't look like ${kind} output (missing expected fields). Double check you ran extract_pdf.py --type ${kind}.`);
    }
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
}

function openImportReview(kind, data, fileName){
  if(kind === 'battletome'){
    if(!Array.isArray(data.units)) throw new Error('missing units[]');
    renderBattletomeReview(data, fileName);
  } else if(kind === 'warscroll'){
    if(!data.name) throw new Error('missing name');
    renderWarscrollReview(data, data.faction || 'Imported', fileName, null);
  } else if(kind === 'rules'){
    if(!Array.isArray(data.sections)) throw new Error('missing sections[]');
    renderRulesReview(data, fileName);
  } else if(kind === 'spells' || kind === 'artifacts'){
    if(!Array.isArray(data.items)) throw new Error('missing items[]');
    renderLoreReview(kind, data, fileName);
  }
}

// ---- Single warscroll review: edit every field before saving ----

function renderWarscrollReview(extracted, faction, fileName, onSaveBack){
  // Abilities become a structured array (name/timing/text/modifier) rather
  // than one big textarea, so each individual ability can optionally carry
  // its own dice-calculator modifier — a unit's command ability might be a
  // flat +1 to hit while its passive is a heal, and those need different
  // treatment.
  const initialAbilities = (extracted.abilities || []).map(a => {
    if (typeof a === 'string') {
      return { name: 'Ability', timing: 'Passive', text: a, _hasModifier: false, _mod: { stat:'hit', op:'add', value:1, label:'' } };
    }
    // Already-structured (e.g. re-editing a unit pulled back from the library)
    return {
      name: a.name || 'Ability', timing: a.timing || 'Passive', text: a.text || '',
      _hasModifier: !!(a.modifiers && a.modifiers.length),
      _mod: (a.modifiers && a.modifiers[0]) ? { ...a.modifiers[0] } : { stat:'hit', op:'add', value:1, label:'' }
    };
  });

  const state = {
    name: extracted.name || '',
    points: extracted.points != null ? String(extracted.points) : '',
    move: (extracted.stats && extracted.stats.move) || '',
    health: (extracted.stats && extracted.stats.health != null) ? String(extracted.stats.health) : '',
    save: (extracted.stats && extracted.stats.save != null) ? String(extracted.stats.save) : '',
    ward: (extracted.stats && extracted.stats.ward != null) ? String(extracted.stats.ward) : '',
    control: (extracted.stats && extracted.stats.control != null) ? String(extracted.stats.control) : '',
    weapons: JSON.parse(JSON.stringify(extracted.weapons || [])),
    abilities: initialAbilities,
    keywords: (extracted.keywords || []).join(', ')
  };

  const STAT_OPTIONS = [['hit','To Hit'],['wound','To Wound'],['rend','Rend'],['damage','Damage'],['attacks','Attacks'],['save','This Unit\'s Save']];

    sheetRoot.innerHTML = `

        <div class="sheet" style="max-height:92%; height:92%;">

          <div class="sheet-header">
            <div class="sheet-title">Review Unit</div>
            <div class="sheet-close" onclick="closeSheet()">Cancel</div>
          </div>
          <div class="sheet-body">
            ${extracted._needs_review !== false ? `<div style="font-size:11px; color:var(--gold); margin-bottom:10px;">⚠ Auto-extracted — check every field against the real warscroll.</div>` : ''}

            <div class="form-label">Name</div>
            <input class="form-input" value="${escapeHtml(state.name)}" oninput="window.__u_name(this.value)">
            <div class="form-label">Points</div>
            <input class="form-input" type="number" value="${escapeHtml(state.points)}" oninput="window.__u_points(this.value)">

            <div class="form-label">Stats</div>
            <div style="display:flex; gap:8px; margin-bottom:16px;">
              <input class="calc-input" style="flex:1;" placeholder="Move" value="${escapeHtml(state.move)}" oninput="window.__u_move(this.value)">
              <input class="calc-input" style="flex:1;" placeholder="Wounds" value="${escapeHtml(state.health)}" oninput="window.__u_health(this.value)">
              <input class="calc-input" style="flex:1;" placeholder="Save" value="${escapeHtml(state.save)}" oninput="window.__u_save(this.value)">
              <input class="calc-input" style="flex:1;" placeholder="Ward" value="${escapeHtml(state.ward)}" oninput="window.__u_ward(this.value)">
              <input class="calc-input" style="flex:1;" placeholder="OC" value="${escapeHtml(state.control)}" oninput="window.__u_control(this.value)">
            </div>

            <div class="form-label">Weapons (${state.weapons.length})</div>
            ${state.weapons.map((w,i)=>`
              <div style="background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px;">
                <input class="form-input" style="margin-bottom:6px;" value="${escapeHtml(w.name||'')}" placeholder="Weapon name" oninput="window.__w_name(${i},this.value)">
                <div style="display:flex; gap:6px;">
                  <input class="calc-input" style="flex:1;" placeholder="Atk" value="${escapeHtml(w.attacks||'')}" oninput="window.__w_attacks(${i},this.value)">
                  <input class="calc-input" style="flex:1;" placeholder="Hit" value="${w.toHit ?? ''}" oninput="window.__w_toHit(${i},this.value)">

                  <input class="calc-input" style="flex:1;" placeholder="Rend" value="${w.rend ?? ''}" oninput="window.__w_rend(${i},this.value)">
                  <input class="calc-input" style="flex:1;" placeholder="Dmg" value="${escapeHtml(w.damage||'')}" oninput="window.__w_damage(${i},this.value)">
                </div>

            <div class="form-label">Abilities (${state.abilities.length})</div>

                      </select>
                      <select class="form-input" style="margin:0; flex:1;" onchange="window.__a_modOp(${i},this.value)">
                        <option value="add" ${a._mod.op==='add'?'selected':''}>Add</option>

  window.__u_move = v => state.move = v;
  window.__u_health = v => state.health = v;
  window.__u_save = v => state.save = v;
  window.__u_ward = v => state.ward = v;
  window.__u_control = v => state.control = v;
  window.__u_keywords = v => state.keywords = v;
  window.__w_name = (i,v) => state.weapons[i].name = v;
  window.__w_attacks = (i,v) => state.weapons[i].attacks = v;
  window.__w_toHit = (i,v) => state.weapons[i].toHit = parseInt(v)||null;
  window.__w_toWound = (i,v) => state.weapons[i].toWound = parseInt(v)||null;
  window.__w_rend = (i,v) => state.weapons[i].rend = parseInt(v)||0;
  window.__w_damage = (i,v) => state.weapons[i].damage = v;
  window.__w_add = () => {
    state.weapons.push({name:'New Weapon', range:'1"', attacks:'1', toHit:4, toWound:4, rend:0, damage:'1', isMelee:true});
    draw();
  };
  window.__a_name = (i,v) => state.abilities[i].name = v;
  window.__a_timing = (i,v) => state.abilities[i].timing = v;
  window.__a_text = (i,v) => state.abilities[i].text = v;
  window.__a_remove = (i) => { state.abilities.splice(i,1); draw(); };
  window.__a_add = () => {
    state.abilities.push({ name:'New Ability', timing:'Passive', text:'', _hasModifier:false, _mod:{stat:'hit',op:'add',value:1,label:''} });
    draw();
  };
  window.__a_toggleMod = i => {
    const a = state.abilities[i];
    a._hasModifier = !a._hasModifier;
    if(a._hasModifier && !a._mod.label){
      const sign = a._mod.op==='add' ? (a._mod.value>=0?'+':'') : 'Set to ';
      a._mod.label = `${sign}${a._mod.value} ${a._mod.stat}`;
    }
    draw();
  };
  window.__a_modStat = (i,v) => { state.abilities[i]._mod.stat = v; draw(); };
  window.__a_modOp = (i,v) => { state.abilities[i]._mod.op = v; draw(); };
  window.__a_modValue = (i,v) => { state.abilities[i]._mod.value = parseInt(v)||0; };
  window.__a_modLabel = (i,v) => { state.abilities[i]._mod.label = v; };
  window.__saveUnit = () => {
    const unit = {
      name: state.name, faction,
      points: parseInt(state.points)||0,
      baseSize: 1, reinforceIncrement: null, maxModels: null,
      stats: {
        move: state.move || '5"',
        health: parseInt(state.health)||1,
        save: parseInt(state.save)||6,
        ward: state.ward ? parseInt(state.ward) : null,
        control: parseInt(state.control)||1
      },
      weapons: state.weapons,
      abilities: state.abilities.map(a => {
        const built = { name: a.name, timing: a.timing, text: a.text };
        if (a._hasModifier) {
          built.modifiers = [{
            stat: a._mod.stat, op: a._mod.op, value: a._mod.value,
            label: a._mod.label || `${a._mod.op==='add'?'+':'Set to '}${a._mod.value} ${a._mod.stat}`,
            side: (a._mod.stat === 'save') ? 'defender' : undefined
          }];
        }
        return built;
      }),
      keywords: state.keywords.split(',').map(s=>s.trim().toUpperCase()).filter(Boolean),
      silhouette: 'infantry', photo: null
    };
    if(onSaveBack){
      onSaveBack(unit);
    } else {
      mergeByName(contentLibrary.units, [unit], u => u.name + '|' + u.faction);
      saveContentLibrary();
      closeSheet();
      renderImport();
    }
  };
  draw();
}

function extractedToUnit(extracted, faction){
  return {
    name: extracted.name || 'Unnamed Unit',
    faction,
    points: extracted.points || 0,
    baseSize: 1, reinforceIncrement: null, maxModels: null,
    stats: {
      move: (extracted.stats && extracted.stats.move) || '5"',
      health: (extracted.stats && extracted.stats.health) || 1,
      save: (extracted.stats && extracted.stats.save) || 6,
      ward: (extracted.stats && extracted.stats.ward) || null,
      control: (extracted.stats && extracted.stats.control) || 1
    },
    weapons: extracted.weapons || [],
    abilities: (extracted.abilities || []).map(t => ({name:'Ability', timing:'Passive', text:t})),
    keywords: extracted.keywords && extracted.keywords.length ? extracted.keywords : ['IMPORTED'],
    silhouette: 'infantry', photo: null
  };
}

// ---- Spell / Artifact lore table review ----

function renderLoreReview(kind, data, fileName){
  const excluded = new Set();
  const items = JSON.parse(JSON.stringify(data.items));
  const scope = { value: '' };
  const isSpells = kind === 'spells';

  // Each item can optionally carry one structured modifier — only meaningful
  // for effects that are genuinely a flat hit/wound/rend/damage/save change.
  // Most ability text (heals, rerolls, "ignore a wound", conditional
  // triggers) isn't representable this way, so this defaults to off and
  // stays off unless you deliberately turn it on for the items where it fits.
  items.forEach(it => {
    if (!it._hasModifier) it._hasModifier = false;
    if (!it._mod) it._mod = { stat: 'hit', op: 'add', value: 1, label: '' };
  });

  const STAT_OPTIONS = isSpells
    ? [['hit','To Hit'],['wound','To Wound'],['rend','Rend'],['damage','Damage'],['attacks','Attacks'],['save','Enemy/Target Save']]
    : [['hit','To Hit'],['wound','To Wound'],['rend','Rend'],['damage','Damage'],['attacks','Attacks']];

  function draw(){
    sheetRoot.innerHTML = `
      <div class="sheet-overlay show" id="pickerOverlay">
        <div class="sheet" style="max-height:92%; height:92%;">
          <div class="sheet-handle"></div>
          <div class="sheet-header">
            <div class="sheet-title">Review ${isSpells?'Spells':'Artifacts'}</div>
            <div class="sheet-close" onclick="closeSheet()">Cancel</div>
          </div>
          <div style="padding:10px 18px;">
            <input class="form-input" placeholder="${isSpells?'Lore name (e.g. Lore of the Storm)':'Faction, or blank for Universal'}"
              value="${escapeHtml(scope.value)}" oninput="window.__scopeEdit(this.value)">
          </div>
          <div class="sheet-body">
            ${items.map((it,i)=>`
              <div style="background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; opacity:${excluded.has(i)?0.4:1};">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <input class="form-input" style="margin:0; flex:1;" value="${escapeHtml(it.name||'')}" oninput="window.__i_name(${i},this.value)">
                  <span onclick="window.__toggleItem(${i})" style="cursor:pointer; margin-left:8px;">${excluded.has(i)?'○':'●'}</span>
                </div>
                ${isSpells ? `<input class="calc-input" style="width:70px; margin-bottom:6px;" placeholder="CV" value="${it.castingValue ?? ''}" oninput="window.__i_cv(${i},this.value)">` : ''}
                <textarea class="form-input" style="min-height:50px; font-size:11px; margin-bottom:8px;" oninput="window.__i_text(${i},this.value)">${escapeHtml(it.text||'')}</textarea>

                <div style="border-top:1px solid var(--line); padding-top:8px;">
                  <div style="display:flex; align-items:center; justify-content:space-between;">
                    <div style="font-size:11px; color:var(--text-md);">Apply as dice calculator modifier?</div>
                    <div class="toggle ${it._hasModifier?'on':''}" onclick="window.__i_toggleMod(${i})"><div class="toggle-knob"></div></div>
                  </div>
                  ${it._hasModifier ? `
                    <div style="font-size:10px; color:var(--text-lo); margin:6px 0 8px 0; line-height:1.4;">
                      Only turn this on if the effect is a flat number change (e.g. "+1 to hit," "add 1 Rend"). Skip it for heals, rerolls, or conditional triggers — those need to be read and applied by you.
                    </div>
                    <div style="display:flex; gap:6px; margin-bottom:6px;">
                      <select class="form-input" style="margin:0; flex:1.3;" onchange="window.__i_modStat(${i},this.value)">
                        ${STAT_OPTIONS.map(([val,label])=>`<option value="${val}" ${it._mod.stat===val?'selected':''}>${label}</option>`).join('')}
                      </select>
                      <select class="form-input" style="margin:0; flex:1;" onchange="window.__i_modOp(${i},this.value)">
                        <option value="add" ${it._mod.op==='add'?'selected':''}>Add</option>
                        <option value="set" ${it._mod.op==='set'?'selected':''}>Set to</option>
                      </select>
                      <input class="calc-input" style="width:56px;" type="number" value="${it._mod.value}" oninput="window.__i_modValue(${i},this.value)">

                    <input class="form-input" style="margin:0;" placeholder="Chip label, e.g. '+1 to Hit'"

                </div>
              </div>
            `).join('')}
          </div>
          <div class="form-create-btn" onclick="window.__importLore()">Import ${items.length - excluded.size} Item(s)</div>
        </div>
      </div>
    `;
  }
  window.__scopeEdit = v => scope.value = v;
  window.__toggleItem = i => { excluded.has(i) ? excluded.delete(i) : excluded.add(i); draw(); };
  window.__i_name = (i,v) => items[i].name = v;
  window.__i_text = (i,v) => items[i].text = v;
  window.__i_cv = (i,v) => items[i].castingValue = parseInt(v)||null;
  window.__i_toggleMod = i => {
    items[i]._hasModifier = !items[i]._hasModifier;
    if(items[i]._hasModifier && !items[i]._mod.label){
      // Reasonable default label so an empty field doesn't ship a blank chip
      const sign = items[i]._mod.op==='add' ? (items[i]._mod.value>=0?'+':'') : 'Set to ';
      items[i]._mod.label = `${sign}${items[i]._mod.value} ${items[i]._mod.stat}`;
    }
    draw();
  };
  window.__i_modStat = (i,v) => { items[i]._mod.stat = v; draw(); };
  window.__i_modOp = (i,v) => { items[i]._mod.op = v; draw(); };
  window.__i_modValue = (i,v) => { items[i]._mod.value = parseInt(v)||0; };
  window.__i_modLabel = (i,v) => { items[i]._mod.label = v; };
  window.__importLore = () => {
    const toImport = items.filter((_,i)=>!excluded.has(i)).map(it => {
      const built = {
        name: it.name,
        lore: scope.value || 'Universal',
        isUniversal: !scope.value,
        text: it.text || '',
        castingValue: it.castingValue || 6
      };
      if (it._hasModifier) {
        built.modifiers = [{
          stat: it._mod.stat, op: it._mod.op, value: it._mod.value,
          label: it._mod.label || `${it._mod.op==='add'?'+':'Set to '}${it._mod.value} ${it._mod.stat}`,
          side: (it._mod.stat === 'save') ? 'defender' : undefined
        }];
      }
      return built;
    });
    if(isSpells){
      mergeByName(contentLibrary.spells, toImport, s => s.name);
    } else {
      mergeByName(contentLibrary.artifacts, toImport, a => a.name);
    }
    saveContentLibrary();
    closeSheet();
    renderImport();
  };
  draw();
}

/* ---------------- Calc state ---------------- */
let calcState = {
  attacks:'10', toHit:3, toWound:3, rend:1, damage:'1',
  targetSave:4, hasWard:false, targetWard:5, hitMod:0, woundMod:0,
  // Which weapon/unit is currently driving the attacker fields, if any —
  // null means "manual entry" (the original behavior). Storing name strings
  // rather than object refs so this survives JSON serialization cleanly if
  // we ever persist the last-used calc setup.
  attackerUnitName: null, attackerWeaponName: null,
  defenderUnitName: null,
  // Set when the attacker/defender was pulled from a specific saved-list
  // entry rather than the generic content library — lets the picker show
  // that entry's nickname, and surfaces its assigned artifact/spell (if
  // any) as an available modifier automatically.
  attackerListId: null, attackerEntryId: null,
  defenderListId: null, defenderEntryId: null,
  // Modifier chips currently toggled on. Each is a full modifier object
  // (stat/op/value/label) plus a source tag so duplicates from re-picking
  // the same unit don't stack silently.
  activeModifiers: [],
  // Values for the generic situational toggles (charge/musician/etc),
  // keyed by SITUATIONAL_MODIFIER_DEFAULTS[].key. Persisted across sessions
  // per your note that this should remember your usual combo.
  situational: storageLoad('calcSituational', {})
};
function saveSituationalDefaults(){
  storageSave('calcSituational', calcState.situational);
}

// ---- Loadout comparison ----
//
// Rather than doubling every input field on a phone-sized screen at once,
// comparison works as a snapshot: configure the attacker normally (weapon
// choice, modifiers, situational toggles all apply), tap "Save as Loadout
// A", then change the attacker to whatever you want to compare (a different
// weapon option, a different unit, manual numbers) and the comparison card
// shows both results side by side against the same defender.
let compareLoadoutA = null; // snapshot of {attackerUnitName, attackerWeaponName, input, result}
let compareMode = false;

function toggleCompareMode(){
  compareMode = !compareMode;
  if(!compareMode) compareLoadoutA = null;
  renderCalc();
}
function commitLoadoutA(){
  const s = calcState;
  const baseInput = {
    attacks: parseDiceAverage(s.attacks),
    toHit: s.toHit, toWound: s.toWound, rend: s.rend,
    damage: parseDiceAverage(s.damage),
    targetSave: s.targetSave,
    targetWard: s.hasWard ? s.targetWard : null,
    hitMod: s.hitMod, woundMod: s.woundMod
  };
  const situationalActive = SITUATIONAL_MODIFIER_DEFAULTS
    .filter(def => (s.situational[def.key] || 0) !== 0)
    .map(def => ({ ...def, value: s.situational[def.key] }));
  const allActiveMods = [...s.activeModifiers, ...situationalActive];
  const input = applyModifiers(baseInput, allActiveMods);
  const result = calculate(input);

  compareLoadoutA = {
    label: s.attackerUnitName ? `${s.attackerUnitName}${s.attackerWeaponName ? ' — ' + s.attackerWeaponName : ''}` : 'Manual Loadout A',
    result
  };
  renderCalc();
}
function clearLoadoutA(){
  compareLoadoutA = null;
  renderCalc();
}
function stepCalc(key, delta){
  const bounds = {
    toHit:[2,6], toWound:[2,6], rend:[0,4], targetSave:[2,7],
    targetWard:[2,6], hitMod:[-2,2], woundMod:[-2,2]
  };
  const [min,max] = bounds[key];
  calcState[key] = Math.max(min, Math.min(max, calcState[key]+delta));
  // Manually nudging a stat that a picked weapon/unit supplied means the
  // person is now overriding it — drop the "linked" label rather than
  // silently keep showing a unit name next to numbers that no longer match it.
  if(['toHit','toWound','rend','damage'].includes(key)) calcState.attackerWeaponName = null;
  if(key==='targetSave' || key==='targetWard') calcState.defenderUnitName = null;
  renderCalc();
}

    <div class="sheet-overlay show" id="pickerOverlay">
      <div class="sheet" style="max-height:75%">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-title">${escapeHtml(displayName)}</div>
          <div class="sheet-close" onclick="closeSheet()">Cancel</div>
        </div>
        <div class="sheet-body">
          ${(unit.weapons||[]).length === 0
            ? `<div class="empty-state"><div class="glyph">⚔️</div><div class="title">No weapons on this unit</div></div>`
            : unit.weapons.map((w,i) => `
                <div class="pick-card" onclick="window.__calcPickEntryWeapon(${i})">
                  <div>
                    <div class="pick-name">${escapeHtml(w.name)}</div>
                    <div class="pick-sub">${w.attacks} atk · ${w.toHit}+/${w.toWound}+ · Rend ${w.rend||0} · ${w.damage} dmg</div>
                  </div>
                </div>
              `).join('')
          }
        </div>
      </div>
    </div>
  `;
  requestAnimationFrame(()=> document.getElementById('pickerOverlay')?.classList.add('show'));

  window.__calcPickEntryWeapon = (weaponIndex) => {
    const weapon = unit.weapons[weaponIndex];
    calcState.attacks = String(weapon.attacks ?? '1');
    calcState.toHit = weapon.toHit || 4;
    calcState.toWound = weapon.toWound || 4;
    calcState.rend = weapon.rend || 0;
    calcState.damage = String(weapon.damage ?? '1');
    calcState.attackerUnitName = displayName;
    calcState.attackerWeaponName = weapon.name;
    calcState.attackerListId = list.id;
    calcState.attackerEntryId = entry.id;
    // Clear out any stale attacker-entry modifiers from a previous unit,
    // then auto-apply this entry's assigned artifact/spell IF it carries a
    // structured modifier — this is the "pull loadout + apply spell
    // effects" behavior, scoped to effects we can represent reliably.
    calcState.activeModifiers = calcState.activeModifiers.filter(m => m.side !== 'attacker-entry');
    const autoMods = [];
    if(entry.artifact && entry.artifact.modifiers){
      entry.artifact.modifiers.forEach(m => autoMods.push({...m, side:'attacker-entry', source: entry.artifact.name}));
    }
    if(entry.spell && entry.spell.modifiers){
      entry.spell.modifiers.forEach(m => autoMods.push({...m, side:'attacker-entry', source: entry.spell.name}));
    }
    calcState.activeModifiers.push(...autoMods);
    closeSheet();
    renderCalc();
  };
}

// Single sheet renderer that walks Faction → Unit → (Weapon, attacker only).
// Kept as one function with a `step` flag rather than three separate sheets
// so the back-navigation and styling stay consistent. Used for the generic
// "Content Library" path (no specific saved-list entry attached).
function renderCalcPickerSheet(opts){
  let bodyHtml = '';
  const factions = calcFactions(); // stable order used for index lookups below

  if(opts.step === 'faction'){
    bodyHtml = factions.length === 0
      ? `<div class="empty-state"><div class="glyph">📭</div><div class="title">No units yet</div><div class="sub">Import a battletome from the<br>Import tab first.</div></div>`
      : factions.map((f,i) => `
          <div class="pick-card" onclick="window.__calcPickFaction(${i})">
            <div class="pick-name">${escapeHtml(f)}</div>
            <div class="pick-sub">${allCalcUnits().filter(u=>u.faction===f).length} unit(s)</div>
          </div>
        `).join('');
  } else if(opts.step === 'unit'){
    const units = allCalcUnits().filter(u => u.faction === opts.faction);
    bodyHtml = units.map((u,i) => `
      <div class="pick-card" onclick="window.__calcPickUnit(${i})">
        <div>
          <div class="pick-name">${escapeHtml(u.name)}</div>
          <div class="pick-sub">Save ${u.stats.save}+${u.stats.ward?(' · Ward '+u.stats.ward+'+'):''}${opts.mode==='attacker' ? ' · '+(u.weapons||[]).length+' weapon(s)' : ''}</div>
        </div>
      </div>
    `).join('');
  } else if(opts.step === 'weapon'){
    const unit = opts.unit;
    bodyHtml = (unit.weapons||[]).length === 0
      ? `<div class="empty-state"><div class="glyph">⚔️</div><div class="title">No weapons on this unit</div></div>`
      : unit.weapons.map((w,i) => `
          <div class="pick-card" onclick="window.__calcPickWeapon(${i})">
            <div>
              <div class="pick-name">${escapeHtml(w.name)}</div>
              <div class="pick-sub">${w.attacks} atk · ${w.toHit}+/${w.toWound}+ · Rend ${w.rend||0} · ${w.damage} dmg</div>
            </div>
          </div>
        `).join('');
  }

  sheetRoot.innerHTML = `
    <div class="sheet-overlay show" id="pickerOverlay">
      <div class="sheet" style="max-height:75%">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <div class="sheet-title">${escapeHtml(opts.title)}</div>
          <div class="sheet-close" onclick="closeSheet()">Cancel</div>
        </div>
        <div class="sheet-body">${bodyHtml}</div>
      </div>
    </div>
  `;

  window.__calcPickFaction = (i) => {
    const faction = factions[i];
    renderCalcPickerSheet({ title: faction, step:'unit', faction, mode: opts.mode });
  };

  window.__calcPickUnit = (unitIndex) => {
    const units = allCalcUnits().filter(u => u.faction === opts.faction);
    const unit = units[unitIndex];
    if(opts.mode === 'defender'){
      calcState.targetSave = unit.stats.save;
      calcState.hasWard = !!unit.stats.ward;
      calcState.targetWard = unit.stats.ward || 5;
      calcState.defenderUnitName = unit.name;
      calcState.defenderListId = null;
      calcState.defenderEntryId = null;
      calcState.activeModifiers = calcState.activeModifiers.filter(m => m.side !== 'defender-entry');
      closeSheet();
      renderCalc();
    } else {
      // Attacker needs a weapon next
      renderCalcPickerSheet({ title: unit.name, step:'weapon', unit, faction: opts.faction, mode: opts.mode });
    }
  };

  window.__calcPickWeapon = (weaponIndex) => {
    const weapon = opts.unit.weapons[weaponIndex];
    calcState.attacks = String(weapon.attacks ?? '1');
    calcState.toHit = weapon.toHit || 4;
    calcState.toWound = weapon.toWound || 4;
    calcState.rend = weapon.rend || 0;
    calcState.damage = String(weapon.damage ?? '1');
    calcState.attackerUnitName = opts.unit.name;
    calcState.attackerWeaponName = weapon.name;
    calcState.attackerListId = null;
    calcState.attackerEntryId = null;
    calcState.activeModifiers = calcState.activeModifiers.filter(m => m.side !== 'attacker-entry');
    closeSheet();
    renderCalc();
  };
}
function clearAttackerLink(){
  calcState.attackerUnitName = null;
  calcState.attackerWeaponName = null;
  calcState.attackerListId = null;
  calcState.attackerEntryId = null;
  calcState.activeModifiers = calcState.activeModifiers.filter(m => m.side !== 'attacker-entry');
  renderCalc();
}
function clearDefenderLink(){
  calcState.defenderUnitName = null;
  calcState.defenderListId = null;
  calcState.defenderEntryId = null;
  calcState.activeModifiers = calcState.activeModifiers.filter(m => m.side !== 'defender-entry');
  renderCalc();
}

/* ---------------- Tab switching ---------------- */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const wasBuilder = currentTab === 'builder' && !activeListId;
    if(tab.dataset.tab === 'builder' && wasBuilder) activeListId = null; // pop-to-root on re-tap
    switchTab(tab.dataset.tab);
  });
});

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* First-launch seeding: only runs if nothing has ever been saved to this
   device before, so re-opening the installed app never duplicates or
   resets your real lists. Once you've saved/deleted anything for real,
   this block is permanently skipped (a 'warscroll.hasLaunched' flag). */
const hasLaunchedBefore = storageLoad('hasLaunched', false);

if (!hasLaunchedBefore) {
  const seedList = {
    id: makeId(),
    name: 'Stormhost Vanguard',
    faction: 'Stormcast Eternals',
    pointsLimit: 2000,
    entries: [
      { unit: JSON.parse(JSON.stringify(UNITS[0])), nickname:'', reinforcements:1, isGeneral:false, artifact:null, spell:null },
      { unit: JSON.parse(JSON.stringify(UNITS[1])), nickname:'Sir Aldric', reinforcements:0, isGeneral:true, artifact: ARTIFACTS[2], spell:null },
      { unit: JSON.parse(JSON.stringify(UNITS[3])), nickname:'', reinforcements:0, isGeneral:false, artifact:null, spell: SPELLS[2] }
    ],
    createdAt: Date.now() - 86400000,
    updatedAt: Date.now() - 3600000
  };
  const seedList2 = {
    id: makeId(),
    name: 'Grand Tournament List',
    faction: 'Stormcast Eternals',
    pointsLimit: 2000,
    entries: [
      { unit: JSON.parse(JSON.stringify(UNITS[2])), nickname:'', reinforcements:1, isGeneral:false, artifact:null, spell:null }
    ],
    createdAt: Date.now() - 172800000,
    updatedAt: Date.now() - 172800000
  };
  savedLists.push(seedList, seedList2);
  homeArtPool.push(
    'linear-gradient(160deg,#3a2a10,#150d05)',
    'linear-gradient(160deg,#2a1010,#0a0505)'
  );
  storageSave('savedLists', savedLists);
  storageSave('homeArtPool', homeArtPool);
  storageSave('hasLaunched', true);
}

pickHeroArt();

// Register the service worker so the app shell is cached for offline launch
// from the Home Screen icon. Safe no-op if served over plain http/file://
// during local testing — service workers require https or localhost.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.log('Service worker registration skipped:', err.message);
    });
  });
}

render();
</script>
